version: '3.8'

services:
  postgres:
    image: postgres:18
    container_name: hotel_booking_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotel_booking
      TZ: UTC

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7
    container_name: hotel_booking_redis
    restart: always

    ports:
      - '6379:6379'

volumes:
  postgres_data:
